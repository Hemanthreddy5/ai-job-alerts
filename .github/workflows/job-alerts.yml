name: AI job alerts
on:
  push:
    branches: [main]
    paths: ['*.py', 'tests/**', 'settings.json', '.github/workflows/job-alerts.yml']
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only (no Slack messages or state changes)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: daily-ai-job-alerts
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref_name == github.event.repository.default_branch && (github.event.repository.visibility == 'public' || vars.FREE_ACTIONS_CONFIRMED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test matching and delivery
        run: python3 -m unittest discover -s tests -v
      - name: Preview live sources
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preview)
        run: python3 alerts.py
      - name: Discover and notify
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.preview)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 alerts.py --send
